spring:
  config:
    import: optional:aws.properties
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${TEST_MARIADB_URL:jdbc:mariadb://localhost:3306/byeol_dam?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${TEST_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:byeoldam}}
    password: ${TEST_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:byeoldam}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    open-in-view: false
  data:
    redis:
      url: ${TEST_REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
    mongodb:
      host: ${TEST_MONGODB_HOST:localhost}
      username: ${TEST_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:byeoldam}}
      password: ${TEST_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:byeoldam}}
      authentication-database: admin
      port: ${TEST_MONGODB_PORT:27017}
      database: ${TEST_MONGODB_DATABASE:byeol_dam}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - profile
              - email
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - name
              - account_email
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret-key: test-jwt-secret-key-code-for-performance-tuning

app:
  auth:
    tokenSecret: test-jwt-token-secret-for-performance-tuning-32-bytes
    tokenExpiry: 7200000
    refreshTokenExpiry: 604800000
  oauth2:
    authorizedRedirectUris:
      - http://localhost:5173/oauth/redirect

mail:
  host: localhost
  port: 2525
  username: test@example.com
  password: test-password
  properties:
    mail:
      smtp:
        auth: false
        starttls:
          enable: false
          required: false
        connection-timeout: 1000
        timeout: 1000
        write-timeout: 1000
  auth-code-expired-ms: 600000

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: '*'
  max-age: 3600

cloud:
  aws:
    s3:
      bucket: test-bucket
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false
